[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "requirements-collection-agent"
version = "0.1.0"
description = "A LangGraph-based agent for iterative software requirements collection and validation."
requires-python = ">=3.11"
dependencies = [
    "langgraph",
    "langchain-aws",
    "pydantic>=2",
    "pydantic-settings>=2",
    "python-dotenv",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
